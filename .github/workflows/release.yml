# Builds the app on a Windows runner and publishes pc-privacy-cleaner.zip as a GitHub Release
# whenever main changes. The README's download link points at releases/latest, so a merge to main
# is all it takes to ship a new zip.
#
# Version: the tag comes from <Version> in the csproj (e.g. v0.3.0).
#   - New version  -> a new Release is created and becomes "latest".
#   - Same version -> the zip in that existing Release is replaced (the tag keeps pointing at the
#                     commit that first created it). Bump <Version> when a change deserves its own release.
name: Release

on:
  push:
    branches: [main]
    # Docs-only changes (README.md, screenshots) do not rebuild the zip.
    paths:
      - 'src/**'
      - 'README.txt'
      - 'build.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write   # create the Release and upload the zip

# Two quick merges must not race on the same Release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same script used for local builds: Release build + zip (exe and README.txt in one folder).
      # Windows PowerShell 5.1 on purpose, the same shell the script is written for.
      - name: Build zip
        shell: powershell
        run: .\build.ps1

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src/PcPrivacyCleaner/PcPrivacyCleaner.csproj -XPath '//Version').Node.InnerText
          if (-not $v) { throw 'No <Version> in PcPrivacyCleaner.csproj' }
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG exists; replacing the zip."
            gh release upload $env:TAG pc-privacy-cleaner.zip --clobber
          } else {
            $notes = @(
              '압축을 풀고 PcPrivacyCleaner.exe를 실행하세요. 자세한 사용법은 zip 안의 README.txt에 있습니다.'
              ''
              '처음 한 번은 연습 모드로 실행해서 무엇이 지워질지 먼저 확인하세요.'
            ) -join "`n"
            gh release create $env:TAG pc-privacy-cleaner.zip --target $env:GITHUB_SHA --title $env:TAG --notes $notes --latest
          }
