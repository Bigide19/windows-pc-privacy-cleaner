      <stop offset="0" stop-color="#3478C6"/>
      <stop offset="1" stop-color="#1A426A"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E6F4"/>
