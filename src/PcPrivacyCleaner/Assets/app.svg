  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <path d="M128 42 L198 68 V122 C198 168 168 199 128 216 C88 199 58 168 58 122 V68 Z" fill="url(#shield)"/>
